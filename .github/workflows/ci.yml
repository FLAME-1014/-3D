name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  disaster-lab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apocalypse-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apocalypse-engine/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  check:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax and local reference checks
        run: npm run check

      - name: Unit tests
        run: npm test
