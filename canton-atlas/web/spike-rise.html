<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>立体书技术验证 · 书页翻动与模型立起</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f4eee1; color: #26221c; font-family: system-ui, sans-serif; overflow: hidden; }
  .stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  canvas#bookCanvas { display: block; width: 100vw; height: 100vh; background: #f4eee1; touch-action: pan-y; }
  .hud { position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }
  button { background: #26221c; color: #fdf8ee; border: none; padding: 10px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; }
  button.secondary { background: transparent; color: #26221c; border: 1px solid #26221c; }
  button:disabled { opacity: .35; cursor: default; }
  .stat { position: absolute; top: 12px; right: 12px; font-size: 12px; color: #6f6659; font-variant-numeric: tabular-nums; text-align: right; line-height: 1.5; }
  .bench { position: absolute; top: 12px; left: 12px; font-size: 12px; color: #6f6659; font-variant-numeric: tabular-nums; white-space: pre; }
  .hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 16px; color: #6f6659; pointer-events: none; opacity: .8; transition: opacity .4s; }
</style>
</head>
<body>
<div class="stage">
  <canvas id="bookCanvas"></canvas>
  <div class="bench" id="bench">build 测量中…</div>
  <div class="stat" id="stat">初始化中…</div>
  <div class="hint" id="hint">左右滑动翻页 · 拖动模型旋转</div>
  <div class="hud">
    <button id="btnPrev" class="secondary">← 上一页</button>
    <button id="btnNext">下一页 →</button>
  </div>
</div>
<script src="immersive/three.min.js"></script>
<script src="data.js"></script>
<script src="js/palette.js"></script>
<script type="module">
const canvas = document.getElementById('bookCanvas');
const statEl = document.getElementById('stat');
const hintEl = document.getElementById('hint');
const benchEl = document.getElementById('bench');
const THREE = window.THREE;

const SPOT_IDS = [
  'chenjiaci','yongqingfang','shamian','beijinglu','yuexiu-park','lizhiwan',
  'shangxiajiu','opera-museum','guangxiao','six-banyan','memorial-hall','yuntai',
  'nanyue-museum','baiyun','canton-tower','sacred-heart','gd-museum','opera-house'
];

let spotIndex = 0;
let renderer, scene, camera;
let modelRoot = null;
let risePlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
let riseProgress = 0; // 0 = 平躺纸面, 1 = 完全立起
let isRising = false, isFolding = false;
let dragMode = null; // null | 'orbit' | 'page'
let dragging = false;
let lastPointer = { x: 0, y: 0 };
let orbit = { yaw: 0.7, pitch: 0.52, distance: 0, target: new THREE.Vector3() };
let buildTimes = {};
let currentBox = null;

const EASE_IN = t => 1 - Math.pow(1 - t, 2.2);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}

async function loadSpot(id) {
  const start = performance.now();
  try {
    const mod = await import(`../content/spots/${encodeURIComponent(id)}/model.js`);
    if (!mod || typeof mod.create !== 'function') throw new Error('模型缺少 create()');
    const model = mod.create();
    const ms = Math.round(performance.now() - start);
    buildTimes[id] = ms;
    return { model, ms };
  } catch (e) {
    statEl.textContent = `加载失败 (${id}): ${e.message}`;
    return null;
  }
}

// 剖切平面必须挂在模型每个材质上，否则只有装饰网格被切、模型整体仍在
// 注意按材质去重：18 件大量网格共享同一材质，逐 mesh 赋值会白耗
function applyRisePlane(root, progress, box) {
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0),
    -(box.min.y + progress * (box.max.y - box.min.y)));
  const seen = new Set();
  root.traverse((o) => {
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach((m) => {
      if (!m || seen.has(m)) return;
      seen.add(m);
      m.clippingPlanes = [plane];
      m.clipShadows = true;
      m.needsUpdate = true;
    });
  });
  return seen.size;
}

function clearRisePlane(root) {
  const seen = new Set();
  root.traverse((o) => {
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach((m) => {
      if (!m || seen.has(m)) return;
      seen.add(m);
      if (m.clippingPlanes) { m.clippingPlanes = null; m.needsUpdate = true; }
    });
  });
}

async function switchSpot(id, opts = {}) {
  if (isRising || isFolding) return;
  isFolding = true;
  riseProgress = 0;

  const old = modelRoot;
  if (old) {
    clearRisePlane(old);
    old.parent.remove(old);
    old.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach((m) => {
          if (m.dispose) m.dispose();
          Object.values(m).forEach((v) => { if (v && v.isTexture) v.dispose(); });
        });
      }
    });
  }
  modelRoot = null;
  await new Promise((r) => requestAnimationFrame(r));

  const result = await loadSpot(id);
  if (!result) { isFolding = false; return; }
  modelRoot = result.model.group;
  scene.add(modelRoot);

  const box = new THREE.Box3().setFromObject(modelRoot);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  currentBox = box;

  // 机位按 diorama.js buildPresets 的口径重建 overview，保证与现有展柜一致
  const aspectFactor = Math.max(1, 1.3 / camera.aspect);
  orbit.distance = maxDim * 1.55 * aspectFactor;
  orbit.target.set(center.x, box.min.y + size.y * 0.34, center.z);
  orbit.yaw = 0.7; orbit.pitch = 0.52;
  updateCamera();

  applyRisePlane(modelRoot, 0, box);
  riseProgress = 0;
  isFolding = false;
  isRising = true;
  statEl.textContent = `${id} · build ${result.ms}ms · ${Math.round(maxDim)}m 尺度 · 立起中`;
  if (spotIndex === 0) hintEl.style.opacity = '0';
  return box;
}

function updateCamera() {
  const r = orbit.distance;
  camera.position.set(
    orbit.target.x + r * Math.cos(orbit.pitch) * Math.sin(orbit.yaw),
    orbit.target.y + r * Math.sin(orbit.pitch),
    orbit.target.z + r * Math.cos(orbit.pitch) * Math.cos(orbit.yaw)
  );
  camera.lookAt(orbit.target);
}

function initRenderer() {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.setClearColor(0x000000, 0);
  if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
  if (THREE.ACESFilmicToneMapping) { renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.02; }
  renderer.shadowMap.enabled = false;
  renderer.localClippingEnabled = true; // 必须：模型材质用 local 剖切而非全局

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.5, 4400);
  camera.position.set(100, 80, 120);
  camera.lookAt(0, 10, 0);

  scene.add(new THREE.HemisphereLight(0xfff7e8, 0x8d8274, 0.95));
  const key = new THREE.DirectionalLight(0xfff0d0, 1.9); key.position.set(70, 120, 90); scene.add(key);
  const fill = new THREE.DirectionalLight(0xcfe0ff, 0.5); fill.position.set(-90, 55, -70); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffd8a8, 0.7); rim.position.set(0, 40, -120); scene.add(rim);
}

function bindControls() {
  canvas.addEventListener('pointerdown', (e) => {
    dragging = true;
    lastPointer.x = e.clientX; lastPointer.y = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastPointer.x;
    const dy = e.clientY - lastPointer.y;
    lastPointer.x = e.clientX; lastPointer.y = e.clientY;
    orbit.yaw -= dx * 0.006;
    orbit.pitch = Math.max(0.06, Math.min(1.35, orbit.pitch + dy * 0.006));
    updateCamera();
  });
  canvas.addEventListener('pointerup', () => { dragging = false; });
  canvas.addEventListener('pointercancel', () => { dragging = false; });
  window.addEventListener('resize', resize);
}

document.getElementById('btnPrev').addEventListener('click', async () => {
  spotIndex = (spotIndex - 1 + SPOT_IDS.length) % SPOT_IDS.length;
  await switchSpot(SPOT_IDS[spotIndex]);
});
document.getElementById('btnNext').addEventListener('click', async () => {
  spotIndex = (spotIndex + 1) % SPOT_IDS.length;
  await switchSpot(SPOT_IDS[spotIndex]);
});

window.addEventListener('load', async () => {
  initRenderer();
  bindControls();
  await switchSpot(SPOT_IDS[0]);

  function tick() {
    requestAnimationFrame(tick);
    if (isRising && modelRoot && currentBox) {
      riseProgress = Math.min(1, riseProgress + 0.022);
      applyRisePlane(modelRoot, riseProgress, currentBox);
      if (riseProgress >= 1) isRising = false;
    }
    renderer.render(scene, camera);
    const info = renderer.info.render;
    statEl.textContent = `页 ${spotIndex + 1}/${SPOT_IDS.length} · ${info.calls} calls · ${info.triangles.toLocaleString('en-US')} tris · rise ${Math.round(riseProgress * 100)}%`;
  }
  tick();
});
</script>
</body>
</html>
