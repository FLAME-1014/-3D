<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#718895" />
    <title>寺庙 · 可交互立体模型</title>
    <meta
      name="description"
      content="一座可以旋转、缩放的微型寺庙。查看45°等轴侧视角，下载完整3D模型与Blender源文件。"
    />
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../blender-workflow/vendor/build/three.module.js",
          "three/addons/": "../blender-workflow/vendor/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main class="page">
      <header class="heading">
        <p class="eyebrow"><span class="status-dot"></span>可交互立体模型</p>
        <h1>寺庙</h1>
        <p class="intro">一方庭院，一座微缩世界。</p>
      </header>

      <section class="scene-section" aria-label="寺庙三维模型预览">
        <div id="stage" class="stage" aria-busy="true">
          <canvas
            id="scene"
            tabindex="0"
            aria-label="寺庙三维模型。拖拽旋转，滚轮或双指缩放；方向键旋转，加减键缩放，按0恢复45度视角。"
          ></canvas>
          <div id="loading" class="loading" role="status">
            <span class="loading-ring" aria-hidden="true"></span>
            <p id="loading-text">正在展开微缩世界</p>
          </div>
          <div id="error" class="error" role="alert" hidden>
            <p class="error-title">暂时无法打开模型</p>
            <p id="error-detail"></p>
            <button type="button" id="retry">重新加载</button>
          </div>
        </div>
      </section>

      <footer class="tools">
        <p class="gesture-hint" id="gesture-hint">拖拽旋转<span>·</span>滚轮 / 双指缩放</p>
        <div class="toolbar" role="group" aria-label="调整模型视角">
          <div class="view-buttons" role="group" aria-label="预设视角">
            <button type="button" data-view="isometric" aria-pressed="true" title="恢复45度视角（快捷键0）">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m10 2 7 4v8l-7 4-7-4V6l7-4Zm0 8 7-4M10 10 3 6m7 4v8"/></svg>
              45°复位
            </button>
            <button type="button" data-view="front" aria-pressed="false">正面</button>
            <button type="button" data-view="back" aria-pressed="false">背面</button>
            <button type="button" data-view="top" aria-pressed="false">俯视</button>
          </div>
          <span class="separator" aria-hidden="true"></span>
          <div class="mode-buttons" role="group" aria-label="模型显示方式">
            <button type="button" id="auto-rotate" aria-pressed="false" title="开启或关闭自动旋转">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.6 7a7 7 0 1 0 .3 5M16.6 7V2.5m0 4.5h-4.5"/></svg>
              <span>自动旋转</span>
            </button>
            <button type="button" id="wireframe" aria-pressed="false" title="显示模型的三角网格">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m10 2 8 15H2L10 2Zm0 0v15M2 17l12-7.5M18 17 6 9.5"/></svg>
              <span>线框</span>
            </button>
          </div>
        </div>
        <div class="downloads">
          <a class="primary-download" href="./temple-diorama.glb" download>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v10m-4-4 4 4 4-4M3 13v4h14v-4"/></svg>
            下载 3D 模型
            <span>GLB</span>
          </a>
          <a href="./temple-diorama.blend" download title="可在Blender中继续编辑">
            Blender 源文件
          </a>
          <button type="button" id="snapshot" title="将当前视角保存为1080×1080图片">
            保存 1080 方图
          </button>
        </div>
        <p class="download-note">GLB 用于展示与导入，Blender 源文件可继续编辑。</p>
      </footer>
      <p id="announcement" class="sr-only" aria-live="polite"></p>
    </main>
    <script type="module" src="./viewer.js"></script>
  </body>
</html>
